<text x="292.00" y="35.00" class="ts" text-anchor="start">R1  Robot ABB IRB 140 (silueta aprox.)</text>
<text x="292.00" y="40.20" class="ts" text-anchor="start">T1  Herramienta (pluma / TCP)</text>
<text x="292.00" y="45.40" class="ts" text-anchor="start">B1  Banda transportadora (inferida)</text>
<text x="292.00" y="50.60" class="ts" text-anchor="start">S1  Botonera y testigos (nominal)</text>
<text x="292.00" y="55.80" class="ts" text-anchor="start">P1  Pastel - posición inicio (trazo largo)</text>
<text x="292.00" y="61.00" class="ts" text-anchor="start">P2  Pastel - posición mitad (punteado)</text>
<text x="292.00" y="66.20" class="ts" text-anchor="start">P3  Pastel - posición final (trazo-punto)</text>
<text x="292.00" y="71.40" class="ts" text-anchor="start">- - -  Zona de alcance IRB 140 (810 mm)</text>
<text x="292.00" y="76.60" class="ts" text-anchor="start">-->  Sentido de movimiento de la banda</text>
<text x="292.00" y="81.80" class="ts" text-anchor="start">X, Y  Ejes de la base de R1 (origen 0,0)</text>
<text x="292.00" y="87.00" class="ts" text-anchor="start">[Lx], [nombre]  Cotas pendientes de medir</text>
<text x="292.00" y="100.20" class="tb" text-anchor="start">NOTAS</text>
<text x="292.00" y="106.20" class="ts" text-anchor="start">1. Proporciones tomadas de las capturas (~3 mm/px).</text>
<text x="292.00" y="111.00" class="ts" text-anchor="start">2. Solo el pastel (190 x 220 mm) es dato aportado.</text>
<text x="292.00" y="115.80" class="ts" text-anchor="start">3. B1 se infiere del movimiento del pastel; su ancho</text>
<text x="292.00" y="120.60" class="ts" text-anchor="start">    y largo dibujados son nominales.</text>
<text x="292.00" y="125.40" class="ts" text-anchor="start">4. S1 no se ve en las capturas: posición nominal.</text>
<text x="292.00" y="130.20" class="ts" text-anchor="start">5. Silueta de R1 aproximada, en la pose de inicio.</text>
<text x="292.00" y="135.00" class="ts" text-anchor="start">6. Sentido de los ejes X/Y por confirmar.</text>
<text x="292.00" y="139.80" class="ts" text-anchor="start">7. Posición de P2 y T1 (mitad) estimada.</text>
<text x="292.00" y="144.60" class="ts" text-anchor="start"></text>
